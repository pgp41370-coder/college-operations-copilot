<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Video compositor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=block" rel="stylesheet" />
<style>
  :root {
    --bg: #0b0d1c; --bg2: #11142a; --panel: #161a33; --line: #2a2f52; --fg: #eef0ff; --fg2: #b7bce0; --muted: #8389b8;
    --brand: #6366f1; --brand2: #818cf8; --brand-soft: rgba(99,102,241,.16);
    --ok: #34d399; --ok-soft: rgba(52,211,153,.14); --warn: #fbbf24; --warn-soft: rgba(251,191,36,.14); --bad: #f87171; --bad-soft: rgba(248,113,113,.14);
    --teal: #2dd4bf;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); font-family: Geist, -apple-system, "Helvetica Neue", Arial, sans-serif; color: var(--fg); -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  .layer { position: absolute; inset: 0; }
  .bg-grad { background: radial-gradient(1200px 700px at 78% -10%, rgba(99,102,241,.28), transparent 60%), radial-gradient(900px 600px at -10% 110%, rgba(45,212,191,.10), transparent 60%), var(--bg); }
  .grid-bg { background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 64px 64px; mask-image: radial-gradient(1000px 700px at 50% 40%, #000, transparent 85%); }
  .eyebrow { font-size: 20px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--brand2); }
  .h1 { font-size: 64px; font-weight: 700; letter-spacing: -.025em; line-height: 1.08; }
  .h2 { font-size: 46px; font-weight: 650; letter-spacing: -.02em; line-height: 1.15; }
  .sub { font-size: 26px; color: var(--fg2); line-height: 1.45; }
  .chip { position: absolute; left: 80px; top: 64px; display: inline-flex; align-items: center; gap: 10px; padding: 9px 16px; border-radius: 999px; font-size: 17px; font-weight: 650; letter-spacing: .1em; text-transform: uppercase; border: 1.5px solid; }
  .chip.current { color: #c7d2fe; border-color: rgba(129,140,248,.6); background: rgba(99,102,241,.14); }
  .chip.future { color: #fde68a; border: 2px dashed rgba(251,191,36,.8); background: rgba(251,191,36,.10); }
  .chip.pilot { color: #99f6e4; border-color: rgba(45,212,191,.6); background: rgba(45,212,191,.10); }
  .chip.context { color: var(--fg2); border-color: var(--line); background: rgba(255,255,255,.03); }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
  .card { background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)); border: 1.5px solid var(--line); border-radius: 18px; }
  .icon svg { width: 100%; height: 100%; }
  .abs { position: absolute; }
  .center { display: flex; align-items: center; justify-content: center; }
  .muted { color: var(--muted); }
  /* footage */
  #foot { position: absolute; inset: 0; overflow: hidden; background: #f6f7fb; }
  #foot img { position: absolute; left: 0; top: 0; transform-origin: 0 0; width: 1920px; height: 1080px; }
  .callout { position: absolute; border-radius: 12px; border: 3.5px solid var(--brand); box-shadow: 0 0 0 6px rgba(99,102,241,.18), 0 10px 40px rgba(17,24,39,.18); }
  .callout.danger { border-color: #e11d48; box-shadow: 0 0 0 6px rgba(225,29,72,.16), 0 10px 40px rgba(17,24,39,.18); }
  .callout.success { border-color: #059669; box-shadow: 0 0 0 6px rgba(5,150,105,.16), 0 10px 40px rgba(17,24,39,.18); }
  .callout.warning { border-color: #d97706; box-shadow: 0 0 0 6px rgba(217,119,6,.16), 0 10px 40px rgba(17,24,39,.18); }
  .clabel { position: absolute; white-space: nowrap; padding: 9px 16px; border-radius: 10px; font-size: 22px; font-weight: 650; color: #fff; background: #4338ca; box-shadow: 0 8px 24px rgba(17,24,39,.25); }
  .clabel.danger { background: #be123c; } .clabel.success { background: #047857; } .clabel.warning { background: #b45309; }
  .dim { position: absolute; inset: 0; background: rgba(15,17,35,.0); }
  .badges { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); display: flex; gap: 10px; }
  .badge { display: inline-flex; align-items: center; gap: 8px; padding: 9px 15px; border-radius: 999px; font-size: 17px; font-weight: 600; background: rgba(17,20,42,.88); color: #e0e7ff; border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(6px); }
  .badge .live { width: 9px; height: 9px; border-radius: 50%; background: #34d399; box-shadow: 0 0 0 4px rgba(52,211,153,.25); }
  .badge.amber { color: #fde68a; }
  .caption { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); width: max-content; max-width: 1560px; padding: 14px 28px; border-radius: 14px; background: rgba(10,12,28,.88); color: #fff; font-size: 33px; font-weight: 600; line-height: 1.32; text-align: center; }
  .stepchip { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 12px; padding: 10px 22px; border-radius: 999px; background: #4338ca; color: #fff; font-size: 24px; font-weight: 650; box-shadow: 0 10px 30px rgba(17,24,39,.3); white-space: nowrap; }
  .lower { position: absolute; left: 50%; bottom: 92px; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; padding: 16px 22px; border-radius: 16px; background: rgba(17,20,42,.92); border: 1px solid rgba(255,255,255,.12); }
  .lower .step { font-size: 22px; font-weight: 600; padding: 8px 14px; border-radius: 10px; }
  .arrow { color: var(--muted); font-size: 24px; }
  .typer { white-space: pre-wrap; }
  .hl { color: var(--brand2); }
  svg.lines { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const W = 1920, H = 1080;
const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const prog = (t, at, dur = .6) => ease((t - at) / dur);
function appear(el, t, at, opts = {}) {
  if (!el) return;
  const p = prog(t, at, opts.dur ?? .6);
  el.style.opacity = String(p * (opts.max ?? 1));
  const dy = (opts.dy ?? 18) * (1 - p), dx = (opts.dx ?? 0) * (1 - p), s = 1 - (opts.scale ?? 0) * (1 - p);
  el.style.transform = `${opts.base ?? ""} translate(${dx}px, ${dy}px) scale(${s})`;
}
const icon = (name, size = 28, color = "currentColor") => `<span class="icon" style="display:inline-block;width:${size}px;height:${size}px;color:${color}">${(window.ICONS || {})[name] || ""}</span>`;
const chipHtml = (status) => {
  const map = { "CURRENT PRODUCT": ["current", "Current product"], "FUTURE ROADMAP": ["future", "Future roadmap · not built yet"], "PILOT": ["pilot", "Pilot · planned"], "CONTEXT": ["context", ""] };
  const [cls, label] = map[status] || ["context", status];
  return label ? `<div class="chip ${cls}"><span class="dot"></span>${label}</div>` : "";
};
const cueOf = (f, i) => f.cues[Math.min(i, f.cues.length - 1)] ?? 0;

/* ------------------------------------------------------------------ scenes */
const SCENES = {};
let built = null, root = null;

SCENES["g01-problem"] = {
  build(f) {
    const docs = [
      ["poster", "Poster", f.assets.poster], ["notice", "Notice", f.assets.notice], ["att", "Attendance sheet", f.assets.attendance],
      ["photo", "Photographs", f.assets.photo], ["report", "Activity report", f.assets.report], ["approval", "Approval", null], ["final", "Final documentation", null],
    ];
    const cw = 214, gap = 36, x0 = (W - (docs.length * cw + (docs.length - 1) * gap)) / 2;
    let html = `<div class="layer bg-grad"></div><div class="layer grid-bg"></div>
      <div class="abs" style="left:80px;top:96px" id="title"><div class="eyebrow">The problem</div><div class="h2" style="margin-top:14px">One activity, many papers</div></div>`;
    docs.forEach(([id, label, src], i) => {
      const x = x0 + i * (cw + gap);
      const inner = src
        ? `<div style="height:250px;border-radius:12px;overflow:hidden;background:#fff"><img src="${src}" style="width:100%;height:100%;object-fit:cover;object-position:top"></div>`
        : `<div class="center" style="height:250px;border-radius:12px;background:rgba(255,255,255,.04);border:1.5px dashed var(--line);flex-direction:column;gap:14px;color:var(--fg2)">${icon(id === "approval" ? "UserCheck" : "FileStack", 64, "#a5b4fc")}<span style="font-size:18px">${id === "approval" ? "Faculty sign-off" : "Filed record"}</span></div>`;
      html += `<div class="abs card" id="d-${id}" style="left:${x}px;top:330px;width:${cw}px;padding:12px">${inner}<div style="margin-top:12px;font-size:20px;font-weight:600;text-align:center">${label}</div></div>`;
      if (i < docs.length - 1) html += `<div class="abs arrow" id="a-${i}" style="left:${x + cw + 4}px;top:455px;width:${gap - 8}px;text-align:center">→</div>`;
    });
    html += `<div class="abs" id="mismatch" style="left:${x0}px;top:296px;width:${2 * cw + gap}px;text-align:center"><span style="display:inline-block;padding:7px 14px;border-radius:999px;background:var(--bad-soft);border:1.5px solid rgba(248,113,113,.6);color:#fecaca;font-size:19px;font-weight:600">Poster: 31 Oct · Notice: 6 Nov</span></div>`;
    const issues = [["Layers", "Details spread across many papers"], ["GitCompareArrows", "Papers may not agree"], ["PenLine", "Attendance is handwritten"], ["Copy", "Copied by hand, every time"]];
    const iw = 400, ig = 24, ix = (W - (4 * iw + 3 * ig)) / 2;
    issues.forEach(([ic, t], i) => {
      html += `<div class="abs card" id="i-${i}" style="left:${ix + i * (iw + ig)}px;top:780px;width:${iw}px;padding:20px 22px;display:flex;align-items:center;gap:16px">${icon(ic, 34, i === 1 ? "#fca5a5" : "#a5b4fc")}<span style="font-size:22px;font-weight:600;line-height:1.3">${t}</span></div>`;
    });
    return $(`<div class="layer">${html}</div>`);
  },
  update(f) {
    const t = f.t, c1 = cueOf(f, 1), c2 = cueOf(f, 2), c3 = cueOf(f, 3), d1 = Math.max(2.5, c2 - c1);
    appear(root.querySelector("#title"), t, cueOf(f, 0));
    ["poster", "notice", "att", "photo", "report", "approval", "final"].forEach((id, i) => {
      appear(root.querySelector(`#d-${id}`), t, c1 - .4 + (i * d1 * .8) / 7, { dy: 30 });
      if (i < 6) appear(root.querySelector(`#a-${i}`), t, c1 - .2 + (i * d1 * .8) / 7, { dy: 0 });
    });
    appear(root.querySelector("#i-0"), t, c1 + 1.5, { dy: 24 });
    appear(root.querySelector("#mismatch"), t, c2 + .8, { dy: 8 });
    appear(root.querySelector("#i-1"), t, c2 + 1.2, { dy: 24 });
    appear(root.querySelector("#i-2"), t, c3 + .5, { dy: 24 });
    appear(root.querySelector("#i-3"), t, c3 + 2.5, { dy: 24 });
  },
};

SCENES["g02-question"] = {
  build(f) {
    return $(`<div class="layer"><div class="layer" style="background:radial-gradient(900px 600px at 50% 40%, rgba(99,102,241,.18), transparent 70%), var(--bg)"></div>
      <div class="abs" style="left:0;right:0;top:250px;text-align:center" id="pre"><div class="eyebrow">What we wanted</div>
        <div class="sub" style="margin-top:22px;font-size:30px">Save teachers the repetitive work.<br/>But <span style="color:#fff;font-weight:600">every detail must come from a real document.</span></div></div>
      <div class="abs" style="left:220px;right:220px;top:520px;text-align:center"><div class="h1 typer" id="q" style="font-size:66px"></div></div></div>`);
  },
  update(f) {
    appear(root.querySelector("#pre"), f.t, cueOf(f, 0));
    const full = "Can a computer do the repetitive work, without ever making up facts?";
    const cut = full.indexOf("without");
    const p = clamp((f.t - cueOf(f, 1) + .2) / 2.8);
    const n = Math.round(full.length * p);
    const shown = full.slice(0, n);
    const caret = p < 1 ? `<span style="color:var(--brand2)">▍</span>` : "";
    root.querySelector("#q").innerHTML = n <= cut ? shown + caret : `${full.slice(0, cut)}<span class="hl">${full.slice(cut, n)}</span>${caret}`;
  },
};

SCENES["g03-product"] = {
  build(f) {
    return $(`<div class="layer"><div class="layer bg-grad"></div><div class="layer grid-bg"></div>${chipHtml("CURRENT PRODUCT")}
      <div class="abs" id="brand" style="left:80px;top:250px;width:760px">
        <div style="width:76px;height:76px;border-radius:18px;background:linear-gradient(135deg,#6366f1,#4338ca);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:28px;box-shadow:0 12px 40px rgba(99,102,241,.45)">CO</div>
        <div class="h1" style="margin-top:34px">College Operations<br/>Copilot</div>
        <div class="sub" style="margin-top:22px">Activity reports from your own documents, checked and approved by you</div>
        <div id="pills" style="margin-top:40px;display:flex;gap:12px">
          ${["Your documents", "Your checks", "Your approval"].map((p, i) => `<span id="pl-${i}" style="padding:10px 18px;border-radius:999px;border:1.5px solid rgba(129,140,248,.5);background:rgba(99,102,241,.12);font-size:21px;font-weight:600;color:#c7d2fe">${p}</span>`).join("")}
        </div></div>
      <div class="abs" id="shot" style="left:900px;top:190px;width:1100px;height:619px;border-radius:18px;overflow:hidden;border:1.5px solid rgba(255,255,255,.18);box-shadow:0 40px 120px rgba(0,0,0,.55)">
        <img src="${f.assets.dashboard}" style="width:100%;height:100%;object-fit:cover;object-position:left top"/></div>
      <div class="abs muted" id="cap" style="left:900px;top:828px;font-size:18px">The real app, online · dashboard</div></div>`);
  },
  update(f) {
    appear(root.querySelector("#brand"), f.t, cueOf(f, 0), { dy: 24 });
    appear(root.querySelector("#shot"), f.t, cueOf(f, 0) + 1.2, { dy: 0, dx: 80, dur: .9 });
    appear(root.querySelector("#cap"), f.t, cueOf(f, 0) + 2);
    [0, 1, 2].forEach((i) => appear(root.querySelector(`#pl-${i}`), f.t, cueOf(f, 1) + .5 + i * .5, { dy: 12 }));
  },
};

const ARCH = [
  ["FileStack", "Evidence", "PDF · JPG · PNG"],
  ["UploadCloud", "Document ingestion", "validated · hashed · stored privately"],
  ["ScanText", "OCR / extraction", "PDF text layer · Tesseract · rules"],
  ["Link2", "Provenance", "document · page · rule · snippet"],
  ["ListChecks", "Validation", "missing · low confidence"],
  ["GitCompareArrows", "Conflict detection", "never auto-resolved"],
  ["UserCheck", "Human review", "confirm · choose · correct", true],
  ["FileText", "Report generation", "template · reviewed fields only"],
  ["ShieldCheck", "Approval", "faculty only · then locked", true],
  ["Download", "Export", "DOCX · PDF · packet · DRAFT until approved"],
];
SCENES["s04-architecture"] = {
  build(f) {
    const nw = 300, nh = 168, gx = 52, x0 = (W - (5 * nw + 4 * gx)) / 2, rows = [250, 520];
    let html = `<div class="layer bg-grad"></div><div class="layer grid-bg"></div>${chipHtml("CURRENT PRODUCT")}
      <div class="abs" style="left:80px;top:130px" id="ttl"><div class="h2">How the current system works</div></div>
      <svg class="lines" id="svg"></svg>`;
    const pos = [];
    ARCH.forEach(([ic, label, sub, human], i) => {
      const r = Math.floor(i / 5), c = i % 5, x = x0 + c * (nw + gx), y = rows[r];
      pos.push([x, y]);
      html += `<div class="abs card" id="n-${i}" style="left:${x}px;top:${y}px;width:${nw}px;height:${nh}px;padding:22px;${human ? "border-color:rgba(52,211,153,.55);background:linear-gradient(180deg,rgba(52,211,153,.10),rgba(52,211,153,.03))" : ""}">
        <div style="display:flex;align-items:center;gap:12px">${icon(ic, 30, human ? "#6ee7b7" : "#a5b4fc")}<span style="font-size:24px;font-weight:650">${label}</span></div>
        <div style="margin-top:14px;font-size:18px;color:var(--fg2);line-height:1.35">${sub}</div>
        ${human ? `<div style="position:absolute;right:14px;top:14px;font-size:13px;font-weight:700;letter-spacing:.1em;color:#6ee7b7">HUMAN</div>` : ""}</div>`;
    });
    html += `<div class="abs" id="np" style="left:${x0}px;top:740px;display:flex;align-items:center;gap:14px;padding:14px 20px;border-radius:14px;background:var(--warn-soft);border:1.5px solid rgba(251,191,36,.5)">${icon("CircleSlash", 26, "#fcd34d")}<span style="font-size:22px;font-weight:600;color:#fde68a">Missing information → “Not provided”. Never filled in.</span></div>`;
    const pr = [["AI assists", "#a5b4fc"], ["Evidence supports", "#a5b4fc"], ["Validation checks", "#fcd34d"], ["Humans approve", "#6ee7b7"]];
    html += `<div class="abs" style="left:0;right:0;top:880px;display:flex;justify-content:center;gap:22px">${pr.map(([p, col], i) => `<span id="pr-${i}" style="font-size:32px;font-weight:700;color:${col}">${p}${i < 3 ? `<span style="color:var(--muted);margin-left:22px">·</span>` : ""}</span>`).join("")}</div>`;
    const el = $(`<div class="layer">${html}</div>`);
    const svg = el.querySelector("#svg");
    let lines = "";
    for (let i = 0; i < ARCH.length - 1; i++) {
      const [x, y] = pos[i], [x2, y2] = pos[i + 1];
      if (i === 4) lines += `<path id="l-${i}" d="M ${x + nw / 2} ${y + nh} C ${x + nw / 2} ${y + nh + 60}, ${x2 + nw / 2} ${y2 - 60}, ${x2 + nw / 2} ${y2}" stroke="#4b5294" stroke-width="3" fill="none" stroke-dasharray="6 7"/>`;
      else lines += `<path id="l-${i}" d="M ${x + nw} ${y + nh / 2} L ${x2} ${y2 + nh / 2}" stroke="#4b5294" stroke-width="3" fill="none"/>`;
    }
    svg.innerHTML = lines;
    return el;
  },
  update(f) {
    const t = f.t, c = (i) => cueOf(f, i);
    appear(root.querySelector("#ttl"), t, c(0) - .3);
    const at = [c(0) + .2, c(0) + 1.6, c(0) + 3.2, c(1) + .2, c(2) + .1, c(2) + 1.0, c(2) + 2.0, c(2) + 2.9, c(2) + 3.8, c(2) + 4.6];
    at.forEach((a, i) => {
      appear(root.querySelector(`#n-${i}`), t, a, { dy: 20 });
      const l = root.querySelector(`#l-${i - 1}`);
      if (l) l.style.opacity = String(prog(t, a - .2, .4));
    });
    appear(root.querySelector("#np"), t, c(3), { dy: 14 });
    [0, 1, 2, 3].forEach((i) => appear(root.querySelector(`#pr-${i}`), t, c(4) + i * .55, { dy: 14 }));
  },
};

SCENES["g04-how"] = {
  build() {
    const parts = [["UploadCloud", "1", "You upload", "the papers you already have", false], ["ScanText", "2", "The app reads and fills in", "and shows the document and page for every detail", false], ["UserCheck", "3", "You check and decide", "correct mistakes · choose when papers disagree", true], ["ShieldCheck", "4", "You approve and download", "ready to print and sign", true]];
    const w = 390, g = 30, x0 = (W - (4 * w + 3 * g)) / 2;
    let html = `<div class="layer bg-grad"></div><div class="layer grid-bg"></div>${chipHtml("CURRENT PRODUCT")}
      <div class="abs" id="ttl" style="left:80px;top:140px"><div class="h2">How it works, in four parts</div></div>`;
    parts.forEach(([ic, n, t, s, you], i) => {
      html += `<div class="abs card" id="h-${i}" style="left:${x0 + i * (w + g)}px;top:280px;width:${w}px;height:300px;padding:30px;${you ? "border-color:rgba(52,211,153,.55);background:linear-gradient(180deg,rgba(52,211,153,.10),rgba(52,211,153,.03))" : ""}">
        <div style="display:flex;align-items:center;justify-content:space-between">${icon(ic, 46, you ? "#6ee7b7" : "#a5b4fc")}<span style="font-size:44px;font-weight:700;color:${you ? "rgba(110,231,183,.45)" : "rgba(165,180,252,.45)"}">${n}</span></div>
        <div style="margin-top:26px;font-size:31px;font-weight:650;line-height:1.2">${t}</div>
        <div style="margin-top:14px;font-size:21px;color:var(--fg2);line-height:1.4">${s}</div>
        ${you ? `<div style="position:absolute;left:30px;bottom:22px;font-size:14px;font-weight:700;letter-spacing:.1em;color:#6ee7b7">DONE BY YOU</div>` : `<div style="position:absolute;left:30px;bottom:22px;font-size:14px;font-weight:700;letter-spacing:.1em;color:#a5b4fc">DONE BY THE APP</div>`}</div>`;
    });
    html += `<div class="abs" id="np" style="left:${x0}px;top:640px;display:flex;align-items:center;gap:14px;padding:16px 22px;border-radius:14px;background:var(--warn-soft);border:1.5px solid rgba(251,191,36,.5)">${icon("CircleSlash", 28, "#fcd34d")}<span style="font-size:24px;font-weight:600;color:#fde68a">Detail not found in any paper? The app writes “Not provided”. It never guesses.</span></div>`;
    return $(`<div class="layer">${html}</div>`);
  },
  update(f) {
    const t = f.t, c = (i) => cueOf(f, i);
    appear(root.querySelector("#ttl"), t, c(0) - .3);
    [1, 2, 3, 4].forEach((k, i) => appear(root.querySelector(`#h-${i}`), t, c(k) + .1, { dy: 24 }));
    appear(root.querySelector("#np"), t, c(5) + .2, { dy: 14 });
  },
};

SCENES["g08-recap"] = {
  build() {
    const steps = [["UploadCloud", "You upload", "the papers you already have"], ["ScanText", "The app fills in", "and shows where each detail came from"], ["UserCheck", "You check and decide", "correct, confirm, choose"], ["ShieldCheck", "You approve", "then download, print and sign"]];
    const w = 360, g = 70, x0 = (W - (4 * w + 3 * g)) / 2;
    let html = `<div class="layer bg-grad"></div><div class="layer grid-bg"></div>${chipHtml("CURRENT PRODUCT")}`;
    steps.forEach(([ic, t, s], i) => {
      const x = x0 + i * (w + g);
      html += `<div class="abs card" id="r-${i}" style="left:${x}px;top:360px;width:${w}px;height:250px;padding:30px">${icon(ic, 42, i === 3 ? "#6ee7b7" : "#a5b4fc")}<div style="margin-top:22px;font-size:30px;font-weight:650">${t}</div><div style="margin-top:12px;font-size:20px;color:var(--fg2)">${s}</div></div>`;
      if (i < 3) html += `<div class="abs arrow" id="ra-${i}" style="left:${x + w + 10}px;top:462px;width:${g - 20}px;text-align:center;font-size:34px">→</div>`;
    });
    html += `<div class="abs" id="goal" style="left:0;right:0;top:700px;text-align:center"><div class="sub" style="font-size:30px">Less copying and searching. <span style="color:#fff;font-weight:600">You stay in control.</span></div></div>`;
    return $(`<div class="layer">${html}</div>`);
  },
  update(f) {
    const d = Math.max(.9, (cueOf(f, 1) - cueOf(f, 0)) / 4.2);
    [0, 1, 2, 3].forEach((i) => { appear(root.querySelector(`#r-${i}`), f.t, cueOf(f, 0) + i * d, { dy: 24 }); if (i < 3) appear(root.querySelector(`#ra-${i}`), f.t, cueOf(f, 0) + i * d + .3, { dy: 0 }); });
    appear(root.querySelector("#goal"), f.t, cueOf(f, 1) + .2);
  },
};

SCENES["g09-future"] = {

    const node = (id, x, y, w, ic, title, sub, kind = "future") => {

    };
    const cx = W / 2, aw = 420;
    let html = `<div class="layer" style="background:radial-gradient(1000px 600px at 50% 0%, rgba(251,191,36,.08), transparent 70%), var(--bg)"></div><div class="layer grid-bg"></div>${chipHtml("FUTURE ROADMAP")}
      <svg class="lines" id="svg"></svg>

    html += node("o", cx - 230, 120, 460, "Network", "Coordinator", "keeps the helpers working together");
    html += node("a1", cx - aw * 1.5 - 40, 290, aw, "FolderSearch", "Document helper", "collects the right documents");
    html += node("a2", cx - aw / 2, 290, aw, "ListChecks", "Checking helper", "checks details against college rules");
    html += node("a3", cx + aw / 2 + 40, 290, aw, "GitCompareArrows", "Disagreement helper", "prepares disagreements for you to decide");
    html += node("a4", cx - 230, 450, 460, "FileText", "Report helper", "drafts reports from checked details");
    html += node("a5", cx - 230, 600, 460, "BellRing", "Follow-up helper", "reminds you about missing documents");
    html += node("fa", cx - 230, 750, 460, "UserCheck", "Teacher approval", "the teacher signs off, always", "human");
    html += `<div class="abs" id="note" style="left:80px;top:700px;width:440px;font-size:22px;color:#fde68a;line-height:1.4">Planned only. To be built after learning from real teachers.</div>`;
    const el = $(`<div class="layer">${html}</div>`);
    const L = (id, x1, y1, x2, y2) => `<path id="${id}" d="M ${x1} ${y1} C ${x1} ${(y1 + y2) / 2}, ${x2} ${(y1 + y2) / 2}, ${x2} ${y2}" stroke="rgba(251,191,36,.55)" stroke-width="2.5" stroke-dasharray="7 7" fill="none"/>`;
    const a1x = cx - aw - 40, a3x = cx + aw + 40;
    el.querySelector("#svg").innerHTML = [L("e1", cx, 216, a1x, 290), L("e2", cx, 216, cx, 290), L("e3", cx, 216, a3x, 290), L("e4", a1x, 386, cx, 450), L("e5", cx, 386, cx, 450), L("e6", a3x, 386, cx, 450), L("e7", cx, 546, cx, 600), L("e8", cx, 696, cx, 750)].join("");
    return el;
  },
  update(f) {
    const t = f.t, c = (i) => cueOf(f, i);

    appear(root.querySelector("#today"), t, c(0));
    appear(root.querySelector("#o"), t, c(1) + 1.0, { max: .55 });
    ["a1", "a2", "a3", "a4", "a5"].forEach((id, i) => appear(root.querySelector(`#${id}`), t, ag(i)));
    const ot = c(2) + d1 * .85; const o = root.querySelector("#o"); if (t >= ot) { o.style.opacity = String(.55 + .45 * prog(t, ot, .5)); o.style.boxShadow = `0 0 ${40 * prog(t, ot)}px rgba(251,191,36,.35)`; }
    appear(root.querySelector("#fa"), t, c(3));
    [["e1", ag(0)], ["e2", ag(1)], ["e3", ag(2)], ["e4", ag(3)], ["e5", ag(3)], ["e6", ag(3)], ["e7", ag(4)], ["e8", c(3) - .1]].forEach(([id, a]) => (root.querySelector(`#${id}`).style.opacity = String(prog(t, a - .2, .4))));
    appear(root.querySelector("#note"), t, c(4));
  },
};

/* ------------------------------------------------------------- footage */
let footEls = null;
function renderFootage(f) {
  if (!footEls) {
    root.innerHTML = "";
    const el = $(`<div class="layer"><div id="foot"><img id="fimg"/></div><div class="layer" id="ov"></div></div>`);
    root.appendChild(el);
    footEls = { img: el.querySelector("#fimg"), ov: el.querySelector("#ov") };
  }
  const v = f.view, s = W / v.w;
  footEls.img.style.transform = `scale(${s}) translate(${-v.x}px, ${-v.y}px)`;
  let ov = "";
  if (f.dim) ov += `<div class="dim" style="background:rgba(15,17,35,${f.dim})"></div>`;
  for (const c of f.callouts || []) {
    if (c.alpha <= 0) continue;
    const x = (c.x - v.x) * s, y = (c.y - v.y) * s, w = c.w * s, h = c.h * s, pad = 8;
    if (w > 0) ov += `<div class="callout ${c.tone || ""}" style="left:${x - pad}px;top:${y - pad}px;width:${w + 2 * pad}px;height:${h + 2 * pad}px;opacity:${c.alpha}"></div>`;
    if (c.label) {
      const above = y - pad - 58 > 70;
      // Label-only callouts (no outline) sit just inside the region, below the step title.
      const lx = w > 0 ? clamp(x - pad, 20, W - 640) : clamp(x + 30, 20, W - 640);
      const ly = w > 0 ? (above ? y - pad - 54 : y + h + pad + 12) : Math.max(y + 24, 84);
      ov += `<div class="clabel ${c.tone || ""}" style="left:${lx}px;top:${ly}px;opacity:${c.alpha}">${c.label}</div>`;
    }
  }
  if (f.lower) ov += f.lower;
  footEls.ov.innerHTML = ov;
}

function overlays(f) {
  let h = "";
  if (f.badges && f.badges.length) h += `<div class="badges">${f.badges.map((b) => `<span class="badge ${b.amber ? "amber" : ""}">${b.live ? '<span class="live"></span>' : ""}${b.text}</span>`).join("")}</div>`;
  if (f.step) h += `<div class="stepchip" style="opacity:${f.stepAlpha ?? 1}">${f.step}</div>`;
  if (f.caption) h += `<div class="caption">${f.caption}</div>`;
  return h;
}

window.render = async (f) => {
  const stage = document.getElementById("stage");
  const key = f.kind === "footage" ? "footage" : f.scene + "|" + (f.variant || "");
  if (built !== key) {
    stage.innerHTML = "";
    root = $(`<div class="layer"></div>`);
    stage.appendChild(root);
    const ovl = $(`<div class="layer" id="global"></div>`);
    stage.appendChild(ovl);
    footEls = null;
    if (f.kind !== "footage") root.appendChild(SCENES[f.scene].build(f));
    built = key;
  }
  if (f.kind === "footage") {
    const img = (footEls && footEls.img) || null;
    renderFootage(f);
    if (footEls.img.getAttribute("src") !== f.src) { footEls.img.src = f.src; await footEls.img.decode().catch(() => {}); }
  } else {
    SCENES[f.scene].update(f);
    await Promise.all([...root.querySelectorAll("img")].map((i) => (i.complete ? null : i.decode().catch(() => {}))));
  }
  document.getElementById("global").innerHTML = overlays(f);
  return true;
};
window.ready = document.fonts.ready.then(() => true);
